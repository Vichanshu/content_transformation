services:
  # Dual-track extraction: Docling documents and FFmpeg + Gemini media transcripts.
  worker:
    build: ./worker
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local Inngest development server; processes submitted transformation jobs.
  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://web:3000/api/inngest
    ports:
      - "8288:8288"
    depends_on:
      - web

  # Dashboard and job API. Gemini is called directly with GEMINI_API_KEY.
  web:
    build: ./web
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      WORKER_INTERNAL_URL: http://worker:8000
      INNGEST_DEV_SERVER_URL: http://inngest:8288
      INNGEST_DEV: http://inngest:8288
    command: sh -c 'DATABASE_URL="$DATABASE_URL_UNPOOLED" npx prisma migrate deploy && npm run start -- --hostname 0.0.0.0'
    ports:
      - "3000:3000"
    depends_on:
      worker:
        condition: service_healthy
